<body>
	<!-- the entire body must be written by student -->

	<div class="mb-3">
  <label for="First Name" class="form-label">First Name</label>
  <input class="form-control" type="text" id="first-name-input">
</div>
<div class="mb-3">
  <label for="Last Name" class="form-label">Last Name</label>
  <input class="form-control" type="text" id="last-name-input" >
</div>
<div class="mb-3">
  <label for="Email Id" class="form-label">Email Id</label>
  <input class="form-control" type="email" id="email-input" >
</div>
<div class="mb-3">
  <label for="College" class="form-label">College</label>
  <input class="form-control form-control-sm" id="college-input" type="text">
</div>
<div class="mb-3">
 <label for="Graduation Year" class="form-label">Graduation Year</label>
    <select class="form-select" id="validationCustom04" required>
      <option selected disabled value="">Choose...</option>
      <option>2020</option>
		<option>2021</option>
		<option>2022</option>
		<option>2023</option>
    </select>
</div>
	<div class="mb-3">
  <label for="Roll No" class="form-label">Roll No</label>
  <input class="form-control form-control-sm" id="Roll" type="text">
</div>
	 <div class="form-check">
      <input class="form-check-input" type="checkbox" value="" id="conditions-checkbox" required>
      <label class="form-check-label" for="invalidCheck">
        Agree to terms and conditions
      </label>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</script>
